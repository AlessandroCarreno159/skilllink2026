# Blueprint de Render: https://render.com/docs/blueprint-spec
# Crear el MySQL externo aparte (Clever Cloud / Aiven / propio) y pegar su
# cadena en ConnectionStrings__DefaultConnection antes del primer deploy.
services:
  - type: web
    name: skilllink
    runtime: docker
    dockerfilePath: ./Dockerfile
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      # Activar solo en un deploy que requiera aplicar migraciones.
      - key: RUN_MIGRATIONS
        value: false
      - key: ConnectionStrings__DefaultConnection
        sync: false
      # Versión del MySQL en la nube (ej. 8.0.22). Debe coincidir con el servidor.
      - key: MySql__ServerVersion
        value: 8.0.22
      - key: AdminSeed__Email
        value: admin@skilllink.local
      - key: AdminSeed__Dni
        value: "10000001"
      # Contraseña del admin inicial. Rotarla/quitarla tras el primer login.
      - key: AdminSeed__Password
        sync: false
      - key: Algolia__ApplicationId
        value: ZUL3Y9M7QD
      # Clave privilegiada SOLO para el servidor (indexación). Se mantiene
      # Algolia__ApiKey como alias; el servicio también acepta Algolia__IndexingApiKey.
      - key: Algolia__ApiKey
        sync: false
      # Search-Only API Key restringida (pública) usada por el buscador del frontend.
      - key: Algolia__SearchApiKey
        sync: false
      - key: Algolia__IndexName
        value: skilllink_index
      # Redis gestionado (Upstash). La credencial NO se versiona: configúrala
      # en el panel de Render (Environment > Add Environment Variable) con la
      # URL completa rediss://default:...@....upstash.io:6379.
      - key: REDIS_URL
        sync: false
      # URL pública del gateway Node (servicio aparte) y secreto HMAC compartido.
      - key: Realtime__Url
        sync: false
      - key: Realtime__Secret
        sync: false
      # Asistente virtual (Gemini). La API key se configura solo en Render.
      - key: Chatbot__Enabled
        value: true
      - key: Chatbot__Model
        value: gemini-flash-lite-latest
      - key: Chatbot__FallbackModel
        value: gemini-3.1-flash-lite
      - key: Chatbot__ApiKey
        sync: false
      # Enlace de soporte humano que muestra el widget del asistente.
      - key: Chatbot__SupportUrl
        value: https://wa.me/+51936211313
